# X11b X4b (2 and 4 separate decode processes) and X5's LLM x training pair again, with all jobs as clients
# of one MPS server instead of time-sliced contexts. Open question 1: how much of the time-slicing penalty is
# context switching? If MPS restores most of X4b's lost throughput, switching was the cost.
experiment: X11 mps
sharing: mps
profile: trace
repeats: 3
pairs:
  - ["llamacpp.phase:model=qwen2.5:3b,phase=decode,tokens=256,reps=2", "llamacpp.phase:model=qwen2.5:3b,phase=decode,tokens=256,reps=2"]
  - ["llamacpp.phase:model=qwen2.5:3b,phase=decode,tokens=256,reps=2", "llamacpp.phase:model=qwen2.5:3b,phase=decode,tokens=256,reps=2", "llamacpp.phase:model=qwen2.5:3b,phase=decode,tokens=256,reps=2", "llamacpp.phase:model=qwen2.5:3b,phase=decode,tokens=256,reps=2"]
  - ["llamacpp.phase:model=qwen2.5:3b,phase=decode,tokens=512,reps=2", "train.small:model=resnet50,batch=64,steps=60"]
