  # SigLIP2 embeddings, 256 frames, batch 64, 6 calls: 1-4 processes
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=embed,images=256,batch=64,repeat=6"]
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=embed,images=256,batch=64,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=embed,images=256,batch=64,repeat=6"]
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=embed,images=256,batch=64,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=embed,images=256,batch=64,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=embed,images=256,batch=64,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=embed,images=256,batch=64,repeat=6"]
  # NVENC transcodes of 120 s 1080p30, CPU decode vs NVDEC: 1-12 copies
  - ["ffmpeg.transcode:seconds=120,mode=transcode,codec=h264_nvenc,preset=p5,decode=cpu"]
