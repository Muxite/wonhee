# C8  Capacity ladders: push each kind of work until throughput stops rising, and record which resource topped out.
# One knob per ladder: concurrent processes (copies of the same job) or in-process batch. Every rung is also
# measured for how close each resource came to its ceiling, over the window where all copies were computing:
#   SM busy, memory-controller busy, VRAM used / 16 GiB, power / 300 W limit (and power-cap throttling share),
#   SM clock / 3210 MHz, NVENC / NVDEC busy, CPU cores / 16, PCIe bytes / 28.8 GB/s (measured pinned ceiling).
# Page cache and CUDA JIT cache warm for every wonhee job (steady state, not readiness: that is C7).
# NVML "busy" is the share of time any kernel ran, not how much of the chip it used: a near-100% SM busy with
# low power and clocks is a serialization or launch limit, not a compute limit. Counter-level detail (SM active,
# tensor, DRAM bandwidth) comes from the metrics runs in c8_ladders.yaml at the top rung of each ladder.
# DEVIATION (2026-10-19, before these runs were analysed; see profiling/analysis/capacity.py): sm_clock is not a
# limiter candidate, and power also counts as topped out when the cap throttled the clocks >= 50% of the window.
experiment: C8 capacity
question: "For each kind of work on this GPU, what limits throughput first as load rises?"
measure: "throughput per rung (work units/s) and per-resource fraction of ceiling in the all-computing window"
analysis: "plateau = first rung where doubling the load adds <10% throughput; limiter = resource >=0.9 of its ceiling at the plateau, else 'software/serialization'; an OOM rung = VRAM wall"
tolerance: "a limiter is named only when one resource is >=0.9 and no other is; two or more >=0.9 -> 'co-limited'"
stop: "2 repeats per rung, interleaved; a ladder stops at its first OOM rung"
decision: "how many copies / how big a batch each lane runs, and which resource a new chip or a second GPU would need more of"
repeats: 2
pairs:
  # whisper (ctranslate2), 100 s clip x 6 calls per process: 1-6 processes (~2.3 GiB each)
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6"]
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6"]
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6"]
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6"]
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6", "wonhee.gpu:jit_cache=shared,cache=warm,task=whisper,clip_s=100,repeat=6"]
  # GPU masks (Grounding-DINO + SAM 2.1), 16 frames x 4 calls: 1-5 processes (~2.9 GiB each)
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=mask,images=16,repeat=4"]
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=mask,images=16,repeat=4", "wonhee.gpu:jit_cache=shared,cache=warm,task=mask,images=16,repeat=4"]
  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=mask,images=16,repeat=4", "wonhee.gpu:jit_cache=shared,cache=warm,task=mask,images=16,repeat=4", "wonhee.gpu:jit_cache=shared,cache=warm,task=mask,images=16,repeat=4"]
