  - ["wonhee.gpu:jit_cache=shared,cache=warm,task=separate,clip_s=100,repeat=4", "wonhee.gpu:jit_cache=shared,cache=warm,task=separate,clip_s=100,repeat=4", "wonhee.gpu:jit_cache=shared,cache=warm,task=separate,clip_s=100,repeat=4", "wonhee.gpu:jit_cache=shared,cache=warm,task=separate,clip_s=100,repeat=4", "wonhee.gpu:jit_cache=shared,cache=warm,task=separate,clip_s=100,repeat=4", "wonhee.gpu:jit_cache=shared,cache=warm,task=separate,clip_s=100,repeat=4"]
