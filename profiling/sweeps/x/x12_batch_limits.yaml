# X12 where batching stops paying off (open question 3). X4a stopped at 8 sequences of 128+256 tokens on 3B.
# Push sequences to 64, prompts to 2k, and models to 7B/14B; the KV cache for the whole context is allocated up
# front, so 14B at 64 x 2k is expected to hit the VRAM wall (a cuda_oom run is kept as censored data).
experiment: X12 batch limits
jobs:
  - {workload: llamacpp.batched, fixed: {prompt_tokens: 128, gen_tokens: 128, parallel: "1,2,4,8,16,32,64"}, grid: {model: ["qwen2.5:3b", "qwen2.5:7b", "qwen2.5:14b"]}, repeats: 2}
  - {workload: llamacpp.batched, fixed: {prompt_tokens: 2048, gen_tokens: 128, parallel: "1,4,16,64"}, grid: {model: ["qwen2.5:3b", "qwen2.5:7b"]}, repeats: 2}
  - {workload: llamacpp.batched, fixed: {model: "qwen2.5:7b", prompt_tokens: 512, gen_tokens: 128, parallel: "1,8,32"}, grid: {ubatch: [128, 512, 2048]}, repeats: 2}
  # one metrics run: tensor-core and DRAM counters at the largest batch that fits
  - {workload: llamacpp.batched, fixed: {model: "qwen2.5:7b", prompt_tokens: 128, gen_tokens: 128, parallel: "1,8,64"}, repeats: 1, profile: metrics}
