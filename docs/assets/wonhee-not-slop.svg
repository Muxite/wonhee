<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Real footage in, a cut and filter pipeline, a finished reel out</title>
  <desc id="desc">A person films real footage. wonhee finds, cuts, filters, captions, fixes sound and checks it. A finished reel comes out and a person posts it. Nothing is generated by a video or image model.</desc>
  <rect width="1200" height="400" rx="24" fill="#f4f1e9"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="49" fill="#234c3d" font-size="18" font-weight="700" letter-spacing="2">NOT A SLOP MACHINE</text>
    <path d="M300 190H350M850 190H900" stroke="#a1b197" stroke-width="3"/>
    <path d="m342 184 8 6-8 6m550-12 8 6-8 6" fill="none" stroke="#a1b197" stroke-width="3" stroke-linejoin="round"/>
    <g>
      <rect x="42" y="92" width="258" height="196" rx="16" fill="#fffdf8" stroke="#d6dbcd"/>
      <text x="66" y="130" fill="#687c5d" font-size="18" font-weight="700">IN</text>
      <text x="66" y="172" fill="#20251f" font-size="28" font-weight="700">Real footage</text>
      <text x="66" y="208" fill="#526052" font-size="19">A person films.</text>
      <text x="66" y="236" fill="#526052" font-size="19">The idea is theirs.</text>
    </g>
    <g>
      <rect x="350" y="92" width="500" height="196" rx="16" fill="#234c3d"/>
      <text x="374" y="130" fill="#b6c99f" font-size="18" font-weight="700">WONHEE</text>
      <text x="374" y="172" fill="#fffdf8" font-size="28" font-weight="700">Cut, filter, edit</text>
      <g font-size="17" font-weight="700" fill="#234c3d">
        <rect x="374" y="196" width="76" height="32" rx="16" fill="#e3ebd6"/><text x="412" y="217" text-anchor="middle">find</text>
        <rect x="460" y="196" width="68" height="32" rx="16" fill="#e3ebd6"/><text x="494" y="217" text-anchor="middle">cut</text>
        <rect x="538" y="196" width="76" height="32" rx="16" fill="#e3ebd6"/><text x="576" y="217" text-anchor="middle">filter</text>
        <rect x="624" y="196" width="92" height="32" rx="16" fill="#e3ebd6"/><text x="670" y="217" text-anchor="middle">caption</text>
        <rect x="726" y="196" width="80" height="32" rx="16" fill="#e3ebd6"/><text x="766" y="217" text-anchor="middle">sound</text>
        <rect x="374" y="238" width="84" height="32" rx="16" fill="#e3ebd6"/><text x="416" y="259" text-anchor="middle">check</text>
      </g>
    </g>
    <g>
      <rect x="900" y="92" width="258" height="196" rx="16" fill="#e8a17f"/>
      <text x="924" y="130" fill="#513c2e" font-size="18" font-weight="700">OUT</text>
      <text x="924" y="172" fill="#20251f" font-size="28" font-weight="700">A finished reel</text>
      <text x="924" y="208" fill="#513c2e" font-size="19">A person posts it.</text>
    </g>
    <rect x="42" y="312" width="1116" height="48" rx="14" fill="#e3ebd6" stroke="#b6c99f"/>
    <text x="600" y="343" text-anchor="middle" fill="#234c3d" font-size="20" font-weight="700">No generated video. No generated images.</text>
  </g>
</svg>
