[project]
name = "gauge"
version = "0.1.0"
description = "Workload profiler with a prediction ledger: predict, run in Docker, measure from the host, score."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "nvidia-ml-py>=12.560",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gauge = "gauge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
