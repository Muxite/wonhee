[project]
name = "wonhee"
version = "0.1.0"
description = "Influencer-side automation: trend scout, editor, prop builder. Optional workload profiler (gauge)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "apify-client>=3.3",
  "scenedetect[opencv]>=0.7",
  "faster-whisper>=1.0",
  "av<17",
  "nvidia-cublas-cu12; sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
  "imagehash>=4.3",
  "pillow>=10",
  "pyyaml>=6",
  "nvidia-ml-py>=12.560",  # gauge: NVML probe
  "yt-dlp[default,curl-cffi]>=2026.8.19",
  # tag awr-compat-a4970c6, the same snapshot awork-resume pins
  "moeka @ git+https://github.com/Muxite/moeka.git@a4970c6169b2dff452a33773747c7376fa3033b0",
  "pathspec>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0"]
viz = [
    "playwright>=1.40",
]
# Creative-memory hybrid search reuses moeka's DocStore with CPU embeddings; FTS remains usable without this extra.
memory = [
    "sentence-transformers>=5.0,<6.0",
    "sqlite-vec>=0.1.9,<1.0",
]

[project.scripts]
wonhee = "wonhee.cli:main"
gauge = "gauge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.extra-build-variables]
# moeka's build hook bundles a web UI wonhee never uses.
moeka = { NANOBOT_SKIP_WEBUI_BUILD = "1" }

[tool.hatch.build.targets.wheel]
packages = ["wonhee", "gauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not gpu'"
markers = ["live: hits real Apify/Brave/LLM (needs keys, costs money)", "gpu: needs CUDA"]

[dependency-groups]
# GPU masks (Grounding-DINO text->box, SAM 2.1 box->mask; both Apache-2.0, from the HF cache) and later GPU audio.
# Not installed by default: `uv sync --group gpu`. Without it, masks fall back to the ONNX U2-Net models on CPU.
gpu = ["torch==2.13.0", "torchvision==0.28.0", "transformers>=5.16.1", "demucs>=4.1",
       "nvidia-cudnn-cu12==9.20.0.48"]  # = the cu13 cuDNN torch pins; mismatched pairs cross-load sublibraries

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
# wonhee runs on this Linux GPU box only; resolving for macOS made demucs (torch<2.3 on Intel Macs) unsatisfiable.
environments = ["sys_platform == 'linux'"]
